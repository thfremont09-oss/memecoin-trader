# Strategy configuration for the memecoin trading bot.
# Secrets (API keys, wallet keys) go in .env, not here.

mode: paper  # paper | live  (live also requires env safety flags, see README)

portfolio:
  starting_balance_usd: 100.0

chain:
  id: solana

# How often the engine does things, in seconds.
timing:
  tick_seconds: 5                    # how often the main loop wakes up
  signal_poll_interval_seconds: 45   # back to 45 — less frantic, only act on hype that's actually persisted a bit
  position_check_interval_seconds: 5  # matches the dashboard's 5s auto-refresh so prices/positions actually update every reload
  equity_snapshot_interval_seconds: 5  # same reason, for the equity chart
  liquidity_rug_check_interval_seconds: 30  # the "sudden liquidity drop" rug check compares against a reading from this far back, NOT position_check_interval_seconds -- a single 5s-apart comparison was firing on ordinary thin-pool price-impact noise, not just real rugs
  token_cooldown_minutes: 60         # back to 60 — more patient before re-buying a token you just sold

entry:
  mention_score_threshold: 55.0      # back to 55 — more selective, needs real conviction before buying
  min_liquidity_usd: 5000            # back to 5000 — avoid the thinnest, easiest-to-manipulate pools
  min_volume_24h_usd: 10000
  min_pair_age_minutes: 5            # avoid the first few minutes (sniper/instant-rug risk) — safety filter, unchanged
  max_pair_age_hours: 72             # only chase fresh hype, not old coins
  max_open_positions: 4              # back to 4 — fewer, more deliberate concurrent bets
  position_size_pct_of_cash: 0.15    # was 0.20 — smaller fraction of cash per trade
  min_trade_usd: 5.0
  max_trade_usd: 25.0                # was 60 — smaller max bet size, scaled back down with the balance
  min_liquidity_to_fdv_pct: 3.0      # tighter floor against thin-liquidity manipulation/rugs — kept, this is a safety filter
  max_price_change_5m_pct: 150.0     # back to 150 — don't chase as hot a pump
  min_buy_sell_ratio: 1.2            # was 1.0 — require healthier buy pressure, not just barely more buys than sells
  corroboration_bonus_score: 15.0    # score bonus when 2+ distinct signal sources flag the same token within the window below
  corroboration_window_minutes: 30   # how recent another source's signal on the same token has to be to count as corroboration

  rug_check:
    enabled: true                    # query RugCheck.xyz before buying
    fail_closed: true                # if the check errors out or the token isn't indexed yet, skip the trade rather than assume it's safe
    max_danger_flags: 0              # any RugCheck "danger"-level finding blocks the trade by default
    max_warning_flags: 2             # was 3 — even less tolerance for smaller red flags stacking up, to buy fewer rug-prone tokens in the first place
    min_lp_locked_pct: 75.0          # was 65 — requires more LP actually locked/burned before trusting a pool, on top of the catastrophic-drop exit above

  ml:
    enabled: true                    # the engine auto-trains a model once enough closed trades exist (see min_training_trades); a no-op gate until then
    min_confidence: 0.65             # was 0.60 — raised again, more cautious once the model is actually live
    min_training_trades: 30          # won't (auto-)train with fewer closed trades than this
    retrain_check_interval_minutes: 60  # how often the engine checks whether it's worth retraining on newly-closed trades

exit:
  stop_loss_pct: 0.15                # was 0.25 — give up on a losing coin faster instead of riding it down
  take_profit_pct: 0.35              # was 0.50 — start locking in real gains sooner
  take_profit_sell_fraction: 0.6     # was 0.5 — bank more of the position on that first take, still leaving room to ride further upside
  trailing_stop_pct: 0.18            # baseline trailing stop while a position's peak gain is below every tier below
  trailing_stop_tiers:
    # "Run away when profits get maximized": the trailing stop tightens as
    # a position's best-ever gain grows, so a real pump gives back less
    # before locking in the win instead of a flat 18% of however big the
    # spike was. Ordered smallest peak-gain threshold first; the tightest
    # tier whose threshold the position's peak has reached wins. Tightened
    # across the board, and extended further, so a coin that goes "super
    # high" gets sold into strength well before a rug pull can give it all
    # back, instead of waiting for a 6% pullback off a moonshot peak.
    - peak_gain_pct: 0.35             # once up 35%+ from entry at some point
      trailing_stop_pct: 0.15
    - peak_gain_pct: 0.75             # up 75%+
      trailing_stop_pct: 0.10
    - peak_gain_pct: 1.50             # up 150%+
      trailing_stop_pct: 0.07
    - peak_gain_pct: 3.00             # up 300%+ (quadrupled) — a real moonshot, protect it hard
      trailing_stop_pct: 0.04
    - peak_gain_pct: 5.00             # up 500%+ — this deep into a pump, any real pullback probably means the rug is starting
      trailing_stop_pct: 0.03
  max_hold_minutes: 240              # force exit after this long regardless
  liquidity_rug_fraction: 0.5        # trips the emergency liquidity-rug exit sooner — kept, this is a safety filter
  sudden_liquidity_drop_pct: 0.45    # was 0.35 — that was firing on ordinary thin-pool volatility, not just real rugs, once liquidity_rug_check_interval_seconds stopped being the same 5s window everything else refreshes on; still well below what a genuine LP pull looks like
  catastrophic_liquidity_drop_pct: 0.70  # NEW: instant exit if liquidity craters this much vs. the literal last poll (any interval), independent of liquidity_rug_check_interval_seconds — a real LP pull can drain a pool within one tick, and widening the sudden-drop window above made that check slower to react to genuine fast rugs, not just noise. 70% in a single tick is far past anything normal trade-impact noise produces.

big_risk:
  # The dashboard's "BIG RISK" button: sell every open position immediately,
  # then spend up to search_window_seconds looking for one signal that
  # clears a *deliberately loosened* set of safety filters below -- still
  # real filters, just not as strict as normal.entry -- and puts as much
  # cash as it can into it, up to max_position_usd. Aborts back to normal
  # multi-source trading if nothing clears the filters in time, or as soon
  # as the one all-in position fully closes for any reason (this
  # stop-loss, the normal rug/trailing/time exits, or a manual sell).
  search_window_seconds: 300         # 5 minutes to find a target before giving up
  poll_interval_seconds: 15          # re-poll every 15s during the search, not the normal 45s (timing.signal_poll_interval_seconds) -- the window is short, so check more often
  stop_loss_pct: 0.10                # tighter than exit.stop_loss_pct (0.15) -- once all-in on the one gamble, cut losses even faster
  max_position_usd: 100.0            # invest as much of the cash balance as it can, capped here -- so this stays a fixed-size gamble instead of scaling up as the account grows

  # Everything below is loosened vs. its entry.* equivalent so the search
  # actually finds something within the window -- moderately less safe,
  # not wide open: max_danger_flags stays 0 (any real RugCheck danger
  # flag still blocks the buy), fail_closed still applies (an
  # unverifiable token still gets skipped), and the mint/freeze-authority
  # checks are hardcoded in entry_strategy.py regardless of config, so
  # those unambiguous rug vectors are never bypassed here either.
  min_liquidity_usd: 2500            # was entry.min_liquidity_usd (5000)
  min_volume_24h_usd: 5000           # was entry.min_volume_24h_usd (10000)
  min_liquidity_to_fdv_pct: 1.5      # was entry.min_liquidity_to_fdv_pct (3.0)
  min_buy_sell_ratio: 1.0            # was entry.min_buy_sell_ratio (1.2) -- neutral instead of requiring net buy pressure
  max_price_change_5m_pct: 300.0     # was entry.max_price_change_5m_pct (150) -- this mode chases momentum even mid-pump
  max_warning_flags: 4               # was entry.rug_check.max_warning_flags (2)
  min_lp_locked_pct: 50.0            # was entry.rug_check.min_lp_locked_pct (75)
  ml_gate_enabled: false             # the ML confidence gate predicts normal-strategy trade quality, which contradicts this mode's whole point of grabbing whatever clears the safety bar

execution:
  paper:
    base_slippage_bps: 50            # 0.5% baseline slippage
    slippage_impact_factor: 2.0      # extra slippage scales with trade_size / liquidity
    fee_bps: 100                     # 1% simulated DEX + network fee
  live:
    max_trade_usd: 5.0               # hard safety cap per trade while in live mode
    slippage_bps: 100                # slippage tolerance sent to the swap router
    priority_fee_lamports: 200000

signals:
  mock:
    trending_refresh_minutes: 10     # how often the mock source refreshes its pool of real trending tokens
    max_signals_per_poll: 3
    run_alongside_real: false        # was true — more cautious: only trade on real signals once a real source is configured, not synthetic hype too
  twitter:
    query: "(pump.fun OR \"just launched\" OR $SOL) (moon OR pump OR gem OR 100x) -is:retweet lang:en"
    max_results_per_poll: 25
  scraper:
    # Real Twitter/X via browser automation instead of the paid API — see
    # README's "Real Twitter/X via browser scraping" section before enabling.
    # Requires: pip install -r requirements-scraper.txt, playwright install
    # chromium, and python scripts/twitter_login_setup.py (once).
    enabled: false
    search_query: "(pump.fun OR \"just launched\" OR $SOL) (moon OR pump OR gem OR 100x) -filter:replies lang:en"
    headless: true
    max_tweets_per_poll: 35            # was 25 — larger candidate pool per poll
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
  reddit:
    # Real Reddit via its free, official API — runs alongside whichever
    # Twitter source is active above (not instead of it). See README's
    # "Reddit" section for how to get REDDIT_CLIENT_ID/REDDIT_CLIENT_SECRET.
    # Enabled by default now, but has no effect until those two env vars are
    # set — the engine logs a warning and falls back to Twitter/mock alone
    # if they're missing.
    enabled: true
    subreddits:
      - CryptoMoonShots
      - solana
      - SatoshiStreetBets
      - CryptoCurrency
      - pumpfun
    max_posts_per_poll: 35             # was 25 — larger candidate pool per poll
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
  pumpfun:
    # Free, no-key WebSocket feed of pump.fun token launches (PumpPortal's
    # public data API: wss://pumpportal.fun/api/data) -- literal on-chain
    # "a token was just created" events, not social hype. This is the
    # highest rug/scam-risk category on Solana (most pump.fun launches are
    # abandoned or scams within minutes), so it's off by default and, even
    # when on, a launch still has to sit in a buffer for min_age_minutes and
    # then clear every existing filter (liquidity, RugCheck, ML gate) like
    # any other signal before a buy happens -- this just adds launches to
    # the candidate pool earlier than social chatter would surface them.
    # See README's "pump.fun launch feed" section before enabling.
    enabled: false
    min_age_minutes: 8                 # buffer a launch this long before considering it (keep >= entry.min_pair_age_minutes)
    max_buffer_minutes: 120            # give up on a launch never re-checked within this long (probably dead / never got a DexScreener listing)
  birdeye:
    # Birdeye's free-tier trending-tokens API (https://docs.birdeye.so) --
    # a third-party trending/momentum ranking, independent of DexScreener's
    # own boosted-tokens list and of social hype. Needs a free API key (see
    # README's "Birdeye" section for how to get BIRDEYE_API_KEY) but no
    # multi-week approval like Reddit now requires.
    enabled: true
    limit: 30                          # was 20 — larger candidate pool per poll
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
  raydium:
    # Raydium's own free, public pools API -- no key, no approval, ever.
    # Raydium is one of the two or three biggest Solana AMMs and where a
    # lot of pump.fun graduates and other memecoins end up listed, so its
    # own by-volume pool ranking is "where the real trading is happening"
    # rather than a third-party trending guess. See README's "Raydium"
    # section.
    enabled: true
    limit: 30
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
  dexscreener_boosts:
    # DexScreener's own free, public "token boosts" API -- teams pay to
    # get promoted on DexScreener's site. No key, no approval, uses the
    # same host this bot already calls for market data. Independent of
    # Birdeye's ranking and every social source; it's paid promotion, not
    # organic momentum, so every other filter still gates it like normal.
    # See README's "DexScreener boosted tokens" section.
    enabled: true
    limit: 30
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
  geckoterminal:
    # GeckoTerminal's free, public trending-pools API -- no key, no
    # approval, ever. A different provider/methodology from Birdeye and
    # DexScreener boosts, so it mostly adds corroboration weight. See
    # README's "GeckoTerminal" section.
    enabled: true
    limit: 20
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
  bluesky:
    # Bluesky's free, fully public searchPosts API -- no key, no approval
    # process, ever (open reads are the AT Protocol's design intent). Runs
    # alongside everything else. See README's "Bluesky" section.
    enabled: true
    query: "(pump.fun OR \"just launched\" OR $SOL) (moon OR pump OR gem OR 100x)"
    max_results_per_poll: 25
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
  farcaster:
    # Farcaster casts via Neynar's free-tier search API
    # (https://docs.neynar.com) -- self-serve NEYNAR_API_KEY, no approval
    # wait. Community skews Ethereum/Base, so expect less than the other
    # sources for this bot's Solana-only universe. See README's "Farcaster"
    # section for how to get NEYNAR_API_KEY.
    enabled: true
    query: "(pump.fun OR \"just launched\" OR $SOL) (moon OR pump OR gem OR 100x)"
    max_results_per_poll: 25
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
  fourchan:
    # 4chan's free, public, unauthenticated /biz/ catalog -- no key, no
    # approval, ever. Deliberately wired as corroboration-only: capped low
    # enough (see fourchan_source.py) that it can never trigger a buy by
    # itself, even with the corroboration bonus, since /biz/ is anonymous
    # and often deliberately deceptive. It only ever strengthens a signal a
    # real source already flagged on the same token. See README's "4chan"
    # section.
    enabled: true
    boards:
      - biz
    max_threads_per_poll: 40
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
  telegram:
    # Real Telegram channel messages via Telegram's own official MTProto
    # client library (Telethon) -- not scraping, this is the same API the
    # real Telegram app uses, reading public channels you choose. Needs a
    # free api_id/api_hash from https://my.telegram.org and a one-time
    # interactive login (phone number + code) via
    # scripts/telegram_login_setup.py -- see README's "Telegram" section.
    enabled: false
    channels:
      - solanamemecoincalls
    max_messages_per_channel_per_poll: 20
    mention_cooldown_minutes: 30       # don't re-signal the same token more often than this
